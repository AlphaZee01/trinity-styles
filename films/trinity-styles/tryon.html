<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 140px; gap: 80px; }
  h2 { font-size: 92px; }
  .kicker { margin-bottom: 18px; }
  .copy p { margin-top: 24px; max-width: 16ch; font-size: 34px; color: #5c6778; }
  .frame {
    height: 760px;
    border-radius: 36px;
    background:
      linear-gradient(180deg, rgb(47 77 181 / 0.16), rgb(47 77 181 / 0.04)),
      #f7f9fd;
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.9);
    display: grid;
    place-items: center;
  }
  .piece {
    width: 280px;
    height: 460px;
    border-radius: 160px 160px 36px 36px;
    background: #2f4db5;
  }
</style>
</head>
<body>
<div class="copy">
  <p class="kicker" id="kicker">Try it on</p>
  <h2 id="title">See the piece on you</h2>
  <p id="line">A photo, then the garment. Before you buy.</p>
</div>
<div class="frame" id="frame"><div class="piece" id="piece"></div></div>
<script type="module">
const kicker = document.getElementById("kicker");
const title = document.getElementById("title");
const line = document.getElementById("line");
const frame = document.getElementById("frame");
const piece = document.getElementById("piece");

function show(node, t, start) {
  const p = Math.min(1, Math.max(0, (t - start) / 0.6));
  const e = 1 - (1 - p) ** 3;
  node.style.opacity = e;
  node.style.translate = `0 ${22 * (1 - e)}px`;
}

window.film = {
  duration: 4.5,
  frame(t) {
    show(kicker, t, 0.1);
    show(title, t, 0.28);
    show(line, t, 0.5);
    const drape = Math.min(1, Math.max(0, (t - 0.7) / 1.1));
    const e = 1 - (1 - drape) ** 3;
    frame.style.opacity = e;
    piece.style.scale = 0.86 + 0.14 * e;
    piece.style.opacity = e;
  },
};
</script>
</body>
</html>
