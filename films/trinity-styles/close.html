<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { display: grid; place-items: center; }
  main { display: grid; justify-items: center; text-align: center; }
  img { width: 140px; height: auto; }
  h1 { margin-top: 24px; font-size: 108px; }
  p { margin-top: 20px; font-size: 34px; color: #5c6778; }
  strong {
    display: block;
    margin-top: 36px;
    font-family: "Segoe UI", sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #2f4db5;
  }
</style>
</head>
<body>
<main>
  <img id="mark" src="assets/logo.png" alt="">
  <h1 id="name">Trinity Styles</h1>
  <p id="line">Pay in Ghana cedis</p>
  <strong id="end">Shop the collection</strong>
</main>
<script type="module">
const nodes = ["mark", "name", "line", "end"].map((id) => document.getElementById(id));

window.film = {
  duration: 4.5,
  frame(t) {
    nodes.forEach((node, index) => {
      const p = Math.min(1, Math.max(0, (t - 0.12 - index * 0.16) / 0.55));
      const e = 1 - (1 - p) ** 3;
      node.style.opacity = e;
      node.style.translate = `0 ${20 * (1 - e)}px`;
    });
  },
};
</script>
</body>
</html>
