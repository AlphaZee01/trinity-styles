<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { display: grid; align-content: center; padding: 0 140px; }
  h2 { font-size: 96px; max-width: 14ch; }
  .kicker { margin-bottom: 18px; }
  .row { display: flex; gap: 28px; margin-top: 56px; }
  article {
    width: 460px;
    padding: 32px;
    border-radius: 28px;
    background: rgb(255 255 255 / 0.72);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.8);
  }
  article h3 { margin: 0; font-size: 34px; font-weight: 500; }
  article p { margin-top: 16px; font-size: 28px; color: #2f4db5; }
</style>
</head>
<body>
<p class="kicker" id="kicker">The shop</p>
<h2 id="title">Pieces, priced in cedis</h2>
<div class="row">
  <article id="one"><h3>Accra Linen Shirt</h3><p>GH₵420</p></article>
  <article id="two"><h3>Cape Coast Wrap Dress</h3><p>GH₵680</p></article>
  <article id="three"><h3>Osu Tailored Blazer</h3><p>GH₵890</p></article>
</div>
<script type="module">
const bits = ["kicker", "title", "one", "two", "three"].map((id) => document.getElementById(id));

window.film = {
  duration: 4.5,
  frame(t) {
    bits.forEach((node, index) => {
      const p = Math.min(1, Math.max(0, (t - index * 0.18) / 0.55));
      const e = 1 - (1 - p) ** 3;
      node.style.opacity = e;
      node.style.translate = `0 ${24 * (1 - e)}px`;
    });
  },
};
</script>
</body>
</html>
