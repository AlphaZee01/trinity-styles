<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trinity Styles</title>
<style>
  html, body { margin: 0; height: 100%; background: #11151c; }
  body { display: grid; place-items: center; }
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #eef3fb; }
  iframe { width: 1920px; height: 1080px; border: 0; transform-origin: top left; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const shots = [
  ["title.html", 4.5],
  ["shop.html", 4.5],
  ["tryon.html", 4.5],
  ["close.html", 4.5],
];
const stage = document.getElementById("stage");
let index = 0;
let started = 0;

function fit(frame) {
  frame.style.scale = stage.clientWidth / 1920;
}

function play() {
  stage.replaceChildren();
  const frame = document.createElement("iframe");
  frame.src = shots[index][0];
  stage.append(frame);
  fit(frame);
  frame.addEventListener("load", () => {
    started = performance.now();
    requestAnimationFrame(tick);
  });
}

function tick(now) {
  const frame = stage.querySelector("iframe");
  const film = frame?.contentWindow?.film;
  const local = (now - started) / 1000;
  if (film) film.frame(Math.max(0, local));
  if (local >= shots[index][1]) {
    index = (index + 1) % shots.length;
    play();
    return;
  }
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  const frame = stage.querySelector("iframe");
  if (frame) fit(frame);
});
play();
</script>
</body>
</html>
